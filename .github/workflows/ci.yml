name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
      AGENT_PATTERN: 'co-authored-by:.*(devin|claude|anthropic|openai|codex|cursor|copilot|chatgpt|gemini|\[bot\])|(generated|created|written) (with|by) \[?(devin|claude|codex|cursor|copilot|chatgpt|gemini)|devin-ai-integration|noreply@anthropic\.com|cursoragent@|copilot-swe-agent'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commits and PR description carry no agent attribution
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if git log -1 --format='%an <%ae>%n%cn <%ce>%n%B' "$sha" | grep -Eiq "$AGENT_PATTERN"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has an agent author or AI attribution line. Recommit it as the requesting team member without Co-Authored-By/Generated-with lines."
              status=1
            fi
          done
          if printf '%s' "$PR_BODY" | grep -Eiq "$AGENT_PATTERN"; then
            echo "::error::The pull request description contains an AI attribution line. Remove it."
            status=1
          fi
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linguini_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linguini_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npx prisma migrate status

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linguini_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linguini_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:deploy
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
