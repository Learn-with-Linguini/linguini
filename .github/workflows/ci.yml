name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - id: filter
        name: Work out which areas changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          run_all() {
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          }
          api() {
            curl -sf --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$1"
          }
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            page=1
            while :; do
              chunk="$(api "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100&page=$page" | jq -r '.[].filename')" \
                || { echo "Could not list PR files; running the full pipeline."; run_all; exit 0; }
              [ -z "$chunk" ] && break
              files="$files$chunk"$'\n'
              [ "$(printf '%s\n' "$chunk" | wc -l)" -lt 100 ] && break
              page=$((page + 1))
            done
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              run_all
              exit 0
            fi
            files="$(api "https://api.github.com/repos/${{ github.repository }}/compare/$before...${{ github.sha }}" | jq -r '.files[].filename')" \
              || { echo "Could not compare push commits; running the full pipeline."; run_all; exit 0; }
            # The compare API truncates its file list at 300 entries; fall back to the full pipeline.
            [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ] && { run_all; exit 0; }
          fi
          printf '%s\n' "$files" | sort -u
          frontend=false
          backend=false
          while IFS= read -r file; do
            case "$file" in
              frontend/*)          frontend=true ;;
              backend/*)           backend=true  ;;
              .github/workflows/*) frontend=true; backend=true ;;
            esac
          done <<< "$files"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Check served SEO content and route responses
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/linguini-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 \
            --output /dev/null http://127.0.0.1:4173/
          node scripts/check-seo.mjs http://127.0.0.1:4173

  database:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linguini_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linguini_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npx prisma migrate status

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/linguini_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linguini_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linguini_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:deploy
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
