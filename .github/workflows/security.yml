name: Security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    name: Python security patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4
      - run: python -m bandit -r app -ll

  python-dependencies:
    name: Python dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pip-audit==2.10.1
      - name: Record resolved versions
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/security-requirements.txt"
          cat "$RUNNER_TEMP/security-requirements.txt"
      - run: python -m pip_audit -r "$RUNNER_TEMP/security-requirements.txt" --strict --no-deps --disable-pip

  javascript-dependencies:
    name: Dependency advisories (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm audit --package-lock-only --audit-level=high
