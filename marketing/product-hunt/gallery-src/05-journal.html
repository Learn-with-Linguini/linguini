<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linguini gallery 05 progress</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background:var(--tomato); }
  .copy { position:absolute; left:64px; top:108px; width:540px; }
  .eyebrow { color:var(--pasta-soft); }
  .headline { color:var(--paper); font-size:82px; }
  .headline .hl { color:var(--pasta-soft); }
  .support { margin-top:24px; color:#fff4e8; width:510px; }
  .progress { margin-top:36px; width:510px; border-radius:23px; border-width:6px; box-shadow:0 18px 38px rgb(125 40 18 / .2); }
  .progress img { width:100%; }
  .board { position:absolute; right:78px; top:35px; width:345px; height:690px; }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">Small sessions add up</p>
    <h1 class="headline">See the habit <span class="hl">growing.</span></h1>
    <p class="support">Track words learned, scenes played and Basil earned—then see where you stand in the weekly Chefs of the Day board.</p>
    <div class="device progress"><img src="../../../frontend/public/app-shots/progress.webp" alt="Current progress counters"></div>
  </div>
  <div class="device board"><img src="../../../frontend/public/app-shots/leaderboard.webp" alt="Current weekly Basil leaderboard"></div>
</body>
</html>
