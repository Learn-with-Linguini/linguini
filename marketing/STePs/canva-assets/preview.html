<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linguini Canva SVG pack</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; background: #f7f3e8; color: #462611; font: 16px/1.4 Arial, sans-serif; }
      h1 { margin: 0 0 28px; text-align: center; }
      .wordmark { display: block; width: min(600px, 85vw); height: 200px; margin: 0 auto 32px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; max-width: 980px; margin: auto; }
      figure { margin: 0; padding: 18px; border-radius: 22px; background: white; box-shadow: 0 8px 24px #7a4f2518; text-align: center; }
      figure img { width: 240px; max-width: 100%; aspect-ratio: 1; object-fit: contain; }
      figcaption { margin-top: 10px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Linguini Canva SVG pack</h1>
    <img class="wordmark" src="linguini-wordmark.svg" alt="Linguini wordmark" />
    <main class="grid">
      <figure><img src="01-linguini-happy.svg" alt="Happy Linguini" /><figcaption>Happy Linguini</figcaption></figure>
      <figure><img src="02-linguini-love.svg" alt="Love Linguini" /><figcaption>Love Linguini</figcaption></figure>
      <figure><img src="03-linguini-cool.svg" alt="Cool Linguini" /><figcaption>Cool Linguini</figcaption></figure>
      <figure><img src="04-farfalle-friend.svg" alt="Farfalle friend" /><figcaption>Farfalle friend</figcaption></figure>
      <figure><img src="05-macaroni-friend.svg" alt="Macaroni friend" /><figcaption>Macaroni friend</figcaption></figure>
      <figure><img src="06-noodle-ball-friend.svg" alt="Noodle ball friend" /><figcaption>Noodle ball friend</figcaption></figure>
      <figure><img src="07-rigatoni-family.svg" alt="Rigatoni family" /><figcaption>Rigatoni family</figcaption></figure>
      <figure><img src="08-ravioli-flag.svg" alt="Ravioli with flag" /><figcaption>Ravioli with flag</figcaption></figure>
      <figure><img src="09-rigatoni-magnifier.svg" alt="Rigatoni detective" /><figcaption>Rigatoni detective</figcaption></figure>
    </main>
  </body>
</html>
