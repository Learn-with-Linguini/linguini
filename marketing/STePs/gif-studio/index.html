<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Linguini — STEPS promo GIF 1: camera roll is the textbook</title>
  <style>
    @font-face { font-family: 'Baloo'; src: url('assets/Baloo2-ExtraBold.ttf'); font-weight: 800; }
    @font-face { font-family: 'Nunito'; src: url('assets/NunitoSans-Bold.ttf'); font-weight: 700; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FFF9ED; font-family: 'Nunito', sans-serif; color: #263238; }
    #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #FFF9ED; }
    .clip { position: absolute; inset: 0; }
    .absolute { position: absolute; }

    .chip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 21px;
      color: #263238;
      box-shadow: 0 6px 18px rgba(38,50,56,0.22);
      white-space: nowrap;
    }
    .chip .dot { width: 11px; height: 11px; border-radius: 50%; background: #E85D32; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="gif-1" data-width="1280" data-height="720" data-duration="6" data-fps="30">
    <div class="clip" data-start="0" data-duration="6">

      <!-- Left: brand + headline -->
      <div class="absolute" style="left: 80px; top: 80px; width: 520px;">
        <img id="wordmark" src="assets/linguini-wordmark.png" style="height: 56px;" alt="Linguini">
        <h1 id="headline" style="font-family: 'Baloo', sans-serif; font-size: 64px; line-height: 1.05; margin: 30px 0 18px 0; color: #263238;">
          Your camera roll<br>is the <span style="color: #E85D32;">textbook.</span>
        </h1>
        <p id="tagline" style="font-size: 24px; font-weight: 700; color: #5b6670; margin: 0;">
          photo-led Spanish &amp; French lessons — CS3216, NUS
        </p>
        <svg id="noodle" style="margin-top: 26px;" width="300" height="70" viewBox="0 0 300 70" fill="none">
          <path d="M6 60 C 60 10, 120 10, 170 35 S 270 60, 294 25" stroke="#F9B233" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Right: photo card + vocab chips -->
      <div id="photo-card" class="absolute" style="right: 80px; top: 90px; width: 560px; height: 540px; background: #ffffff; border-radius: 28px; padding: 14px; box-shadow: 0 30px 60px rgba(38,50,56,0.16); transform: rotate(2deg);">
        <div style="position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden;">
          <img src="assets/cafe-interior.jpg" style="width: 100%; height: 100%; object-fit: cover; object-position: 45% 60%;" alt="Café interior">
          <span class="chip" id="chip-sofa" style="left: 285px; top: 330px;"><span class="dot"></span>el sofá</span>
          <span class="chip" id="chip-mesa" style="left: 190px; top: 240px;"><span class="dot"></span>la mesa</span>
          <span class="chip" id="chip-lampara" style="left: 380px; top: 120px;"><span class="dot"></span>la lámpara</span>
          <span class="chip" id="chip-ventana" style="left: 330px; top: 60px;"><span class="dot"></span>la ventana</span>
        </div>
      </div>

      <img id="mascot" src="assets/mascot-180.png" style="position: absolute; left: 88px; bottom: 40px; width: 90px;" alt="Linguini mascot">
    </div>
  </div>

  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#wordmark', { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.1);
    tl.fromTo('#headline', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.3);
    tl.fromTo('#tagline', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power2.out' }, 0.7);
    tl.fromTo('#noodle path', { strokeDasharray: 500, strokeDashoffset: 500 }, { strokeDashoffset: 0, duration: 0.8, ease: 'power2.inOut' }, 1.0);
    tl.fromTo('#photo-card', { x: 120, rotation: 9, opacity: 0 }, { x: 0, rotation: 2, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0.9);
    tl.fromTo('#chip-mesa', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 1.9);
    tl.fromTo('#chip-sofa', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 2.2);
    tl.fromTo('#chip-lampara', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 2.5);
    tl.fromTo('#chip-ventana', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 2.8);
    tl.fromTo('#mascot', { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.6)' }, 2.6);
    tl.to('#photo-card', { rotation: 0.5, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.2);
    tl.to('.chip', { y: -6, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.1 }, 3.4);
    window.__timelines = window.__timelines || {};
    window.__timelines['gif-1'] = tl;
  </script>
</body>
</html>
