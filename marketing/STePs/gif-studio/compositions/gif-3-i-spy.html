<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Linguini — STEPS promo GIF 3: Veo, veo</title>
  <style>
    @font-face { font-family: 'Baloo'; src: url('../assets/Baloo2-ExtraBold.ttf'); font-weight: 800; }
    @font-face { font-family: 'Nunito'; src: url('../assets/NunitoSans-Bold.ttf'); font-weight: 700; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FFF9ED; font-family: 'Nunito', sans-serif; color: #263238; }
    #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #FFF9ED; }
    .clip { position: absolute; inset: 0; }
    .absolute { position: absolute; }

    .choice {
      background: #ffffff;
      border: 2px solid #f0e6cf;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 22px;
      font-weight: 800;
      color: #263238;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="gif-3" data-width="1280" data-height="720" data-duration="6" data-fps="30">
    <div class="clip" data-start="0" data-duration="6">

      <img id="wordmark" src="../assets/linguini-wordmark.png" style="position: absolute; left: 80px; top: 70px; height: 54px;" alt="Linguini">

      <!-- Mascot + speech bubble -->
      <img id="mascot" src="../assets/mascot-180.png" style="position: absolute; left: 90px; bottom: 70px; width: 190px;" alt="Linguini mascot">
      <div id="bubble" style="position: absolute; left: 250px; top: 150px; max-width: 560px; background: #ffffff; border: 2px solid #f0e6cf; border-radius: 26px 26px 26px 6px; padding: 26px 34px; box-shadow: 0 24px 50px rgba(38,50,56,0.12);">
        <div style="font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #E85D32; text-transform: uppercase; margin-bottom: 10px;">Linguini says</div>
        <div id="clue" style="font-family: 'Baloo', sans-serif; font-size: 44px; line-height: 1.15; color: #263238;"></div>
      </div>

      <!-- Choice stack -->
      <div id="choices" style="position: absolute; right: 90px; top: 200px; width: 400px; display: flex; flex-direction: column; gap: 14px;">
        <div class="choice" id="c1">la mesa<span></span></div>
        <div class="choice" id="c2">el café<span id="tick" style="color: #21716F; opacity: 0;">✓</span></div>
        <div class="choice" id="c3">la taza<span></span></div>
      </div>

      <div id="tagline" style="position: absolute; right: 90px; bottom: 90px; font-family: 'Baloo', sans-serif; font-size: 38px; color: #263238;">
        Play I-Spy <span style="color: #E85D32;">with your world.</span>
      </div>
    </div>
  </div>

  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    const clueText = 'Veo, veo, algo que empieza con C…';
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#wordmark', { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.1);
    tl.fromTo('#mascot', { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'back.out(1.5)' }, 0.4);
    tl.fromTo('#bubble', { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.7)' }, 0.8);
    tl.fromTo('#choices .choice', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.15, ease: 'power2.out' }, 1.3);

    // Type the clue letter by letter
    clueText.split('').forEach((ch, i) => {
      tl.call(() => { document.getElementById('clue').textContent = clueText.slice(0, i + 1); }, null, 1.5 + i * 0.045);
    });
    const typeEnd = 1.5 + clueText.length * 0.045;

    tl.to('#c2', { backgroundColor: '#eef6f3', borderColor: '#21716F', color: '#21716F', duration: 0.3 }, typeEnd + 0.4);
    tl.to('#tick', { opacity: 1, duration: 0.25 }, typeEnd + 0.5);
    tl.fromTo('#mascot', { rotation: 0 }, { rotation: -4, duration: 0.25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, typeEnd + 0.5);
    tl.fromTo('#tagline', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, typeEnd + 0.9);
    window.__timelines = window.__timelines || {};
    window.__timelines['gif-3'] = tl;
  </script>
</body>
</html>
