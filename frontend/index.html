<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/linguini-logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8ef" />
    <script>
      // Consume private I-Spy invitations before analytics can read the URL.
      if (location.pathname === '/ispy/friends') {
        var friendInvite = new URLSearchParams(location.hash.slice(1)).get('invite');
        if (friendInvite !== null) {
          window.linguiniFriendInvite = friendInvite.slice(0, 200);
          try { sessionStorage.setItem('linguini-friend-chat-invite', window.linguiniFriendInvite); } catch (_) {}
          history.replaceState(history.state, '', location.pathname + location.search);
        }
      }
    </script>
    <script async src="https://t.contentsquare.net/uxa/6a01544c67dfc.js"></script>
    <script>document.documentElement.classList.add('js')</script>
    <title data-shell-meta>Linguini</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
