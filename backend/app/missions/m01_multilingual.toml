# Explicit level plans for the multilingual M01 path. The model fills these plans;
# it never chooses targets, workload or assessment criteria itself.
plan_version = 2

[levels.A0]
content_version = 1
fact_kinds = ["object"]
min_objects = 2
min_detail_facts = 0
focus_objects = 2
max_answer_chunks = 6
[levels.A0.preparation]
per_object = true
extra_cards = 2

[[levels.A0.questions]]
purpose = "matchName"
target_ids = ["recognise-name"]
interaction = "markerChoice"
evidence = "recognition"
criteria = ["name-matches-object"]
focus = 1
options = [2, 3]

[[levels.A0.questions]]
purpose = "confirmName"
target_ids = ["identify-object"]
interaction = "multipleChoice"
evidence = "recognition"
criteria = ["identifies-object"]
focus = 1
options = [2, 2]

[[levels.A0.questions]]
purpose = "buildIdentify"
target_ids = ["identify-object"]
interaction = "sentenceBuilding"
evidence = "construction"
criteria = ["identifies-object"]
focus = 1
distractor_chunks = [1, 1]

[[levels.A0.questions]]
purpose = "matchName"
target_ids = ["recognise-name"]
interaction = "markerChoice"
evidence = "recognition"
criteria = ["name-matches-object"]
focus = 2
options = [2, 3]

[[levels.A0.questions]]
purpose = "confirmName"
target_ids = ["identify-object"]
interaction = "multipleChoice"
evidence = "recognition"
criteria = ["identifies-object"]
focus = 2
options = [2, 2]

[[levels.A0.questions]]
purpose = "buildIdentify"
target_ids = ["identify-object"]
interaction = "sentenceBuilding"
evidence = "construction"
criteria = ["identifies-object"]
focus = 2
distractor_chunks = [1, 1]

[levels.A1]
content_version = 1
fact_kinds = ["object", "attribute", "relation"]
min_objects = 2
min_detail_facts = 1
focus_objects = 2
