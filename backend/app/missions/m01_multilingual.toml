[levels.A1.preparation]
per_object = false
extra_cards = 0

[[levels.A1.questions]]
purpose = "confirmObject"
target_ids = ["identify-object", "name-object"]
interaction = "multipleChoice"
evidence = "recognition"
criteria = ["selects-described-object", "article-matches-noun"]
focus = 1
options = [2, 2]

[[levels.A1.questions]]
purpose = "confirmObject"
target_ids = ["identify-object", "name-object"]
interaction = "multipleChoice"
evidence = "recognition"
criteria = ["selects-described-object", "article-matches-noun"]
focus = 2
options = [2, 2]

[[levels.A1.questions]]
purpose = "chooseAttribute"
target_ids = ["describe-colour"]
interaction = "multipleChoice"
evidence = "recognition"
criteria = ["colour-matches-photo"]
focus = 1
options = [2, 3]

[[levels.A1.questions]]
purpose = "describeObject"
target_ids = ["name-object", "describe-colour"]
interaction = "sentenceBuilding"
evidence = "construction"
criteria = ["article-matches-noun", "colour-matches-photo"]
