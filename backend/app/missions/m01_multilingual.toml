min_connected_facts = 2
[levels.A2.preparation]
per_object = false
extra_cards = 0

[[levels.A2.questions]]
purpose = "chooseSceneMarker"
target_ids = ["identify-scene-object"]
interaction = "markerChoice"
evidence = "objectSelection"
criteria = ["scene-object-matches-fact"]
focus = 1
options = [2, 2]

[[levels.A2.questions]]
purpose = "buildSceneFact"
target_ids = ["describe-scene-facts"]
interaction = "sentenceBuilding"
evidence = "construction"
criteria = ["scene-sentence-matches-facts"]
focus = 1
distractor_chunks = [1, 1]

[[levels.A2.questions]]
purpose = "chooseSceneDescription"
target_ids = ["describe-scene-facts"]
interaction = "multipleChoice"
evidence = "recognition"
criteria = ["scene-sentence-matches-facts"]
focus = 1
options = [3, 3]

[[levels.A2.questions]]
purpose = "buildSceneDescription"
target_ids = ["connect-scene-facts"]
