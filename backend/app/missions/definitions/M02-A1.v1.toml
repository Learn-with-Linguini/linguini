mission_id = "M02"
practice_level = "A1"
content_version = 1
title = "Ask where it is"

[photo_requirements]
media_sources = ["preloaded", "camera", "userUpload"]
# Two objects so one can locate the other through a confirmed relation.
min_confirmed_objects = 2
min_relations = 1
relations = ["on", "under", "next_to", "in_front_of", "behind"]

[objective]
objective_id = "ask-where-object-is"
can_do = "I can ask where an object in my photo is and understand a short answer."

[[objective.targets]]
target_id = "recognise-question"
summary = "Recognise the memorised question that asks where an object is."
evidence_types = ["recognition"]

[[objective.targets]]
target_id = "build-question"
summary = "Assemble the memorised where-question with an object's noun phrase."
evidence_types = ["construction"]

[[objective.targets]]
target_id = "name-object"
summary = "Name a photo object with its article and noun."
evidence_types = ["recognition", "construction"]

[[objective.targets]]
target_id = "understand-location"
summary = "Understand a short answer saying where an object is relative to another."
evidence_types = ["recognition"]

[[language_patterns]]
pattern_id = "where-question"
target_id = "build-question"
structure = "[where] [is] [article] [noun]?"
examples = { es = ["¿Dónde está la taza?", "¿Dónde está el libro?"], fr = ["Où est la tasse ?", "Où est le livre ?"] }

[[language_patterns]]
pattern_id = "location-answer"
target_id = "understand-location"
structure = "[article] [noun] [is] [position] [article] [reference noun]."
clue_frame_id = "location"
examples = { es = ["La taza está sobre la mesa.", "El libro está al lado de la puerta."], fr = ["La tasse est sur la table.", "Le livre est à côté de la porte."] }

[teaching]
task_sequence = ["vocabularyIntroduction", "grammarLesson", "ispyRound", "reflection"]
teach_before_assessment = ["name-object", "build-question", "understand-location"]
max_new_words = 6

[[teaching.supports]]
support = "translation"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "audio"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "example"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "wordBank"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "hint"
availability = "onRequest"
counts_as_assistance = true

[[teaching.supports]]
support = "answerReveal"
availability = "onRequest"
counts_as_assistance = true

[[evaluation_criteria]]
criterion_id = "question-chunk-correct"
target_id = "recognise-question"
description = "Picks the memorised where-question for the asked object."
evidence_types = ["recognition"]

[[evaluation_criteria]]
criterion_id = "question-names-object"
target_id = "build-question"
description = "Assembles the where-question in order with the asked object."
evidence_types = ["construction"]

[[evaluation_criteria]]
criterion_id = "article-matches-noun"
target_id = "name-object"
description = "Uses the object's noun with the article that matches its gender and number."
evidence_types = ["recognition", "construction"]

[[evaluation_criteria]]
criterion_id = "position-matches-photo"
target_id = "understand-location"
description = "Understands the position and reference object that the confirmed photo shows."
evidence_types = ["recognition"]

[expected_performance]
min_assessed_questions = 2
min_correct_ratio = 0.75
min_independent_correct = 1
required_target_groups = [
  ["build-question"],
  ["understand-location"],
]
