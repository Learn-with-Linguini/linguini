mission_id = "M05"
practice_level = "A1"
content_version = 1
title = "Say what you like"

[photo_requirements]
media_sources = ["preloaded", "camera", "userUpload"]
min_confirmed_objects = 3

[objective]
objective_id = "say-what-you-like"
can_do = "I can say what I or a named person likes in a pretend situation."

[[objective.targets]]
target_id = "choose-preference"
summary = "Choose the preference statement that matches a pretend subject."
evidence_types = ["recognition"]

[[objective.targets]]
target_id = "say-my-preference"
summary = "Say what you pretend to like or dislike."
evidence_types = ["construction"]

[[objective.targets]]
target_id = "say-their-preference"
summary = "Say what a named character pretends to like or dislike."
evidence_types = ["construction"]

[[language_patterns]]
pattern_id = "first-person-positive-preference"
target_id = "say-my-preference"
structure = "[first-person subject] [like verb] [singular noun phrase]."
examples = { es = ["Me gusta el libro."], fr = ["J'aime le livre."] }

[[language_patterns]]
pattern_id = "first-person-negative-preference"
target_id = "say-my-preference"
structure = "[first-person subject] [negative like verb] [singular noun phrase]."
examples = { es = ["No me gusta la taza."], fr = ["Je n'aime pas la tasse."] }

[[language_patterns]]
pattern_id = "third-person-positive-preference"
target_id = "say-their-preference"
structure = "[named subject] [like verb] [singular noun phrase]."
examples = { es = ["A Ana le gusta la taza."], fr = ["Ana aime la tasse."] }

[[language_patterns]]
pattern_id = "third-person-negative-preference"
target_id = "say-their-preference"
structure = "[named subject] [negative like verb] [singular noun phrase]."
examples = { es = ["A Leo no le gusta el libro."], fr = ["Leo n'aime pas le livre."] }

[teaching]
task_sequence = ["vocabularyIntroduction", "grammarLesson"]
teach_before_assessment = ["choose-preference", "say-my-preference", "say-their-preference"]
max_new_words = 6

[[teaching.supports]]
support = "translation"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "audio"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "example"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "wordBank"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "hint"
availability = "onRequest"
counts_as_assistance = true

[[teaching.supports]]
support = "answerReveal"
availability = "onRequest"
counts_as_assistance = true

[[evaluation_criteria]]
criterion_id = "chooses-preference"
target_id = "choose-preference"
description = "Chooses the taught preference statement for the assigned subject."
evidence_types = ["recognition"]

[[evaluation_criteria]]
criterion_id = "says-my-preference"
target_id = "say-my-preference"
description = "Builds a first-person singular like or dislike statement."
evidence_types = ["construction"]

[[evaluation_criteria]]
criterion_id = "says-their-preference"
target_id = "say-their-preference"
description = "Builds a named character's third-person singular preference statement."
evidence_types = ["construction"]

[expected_performance]
min_assessed_questions = 2
min_correct_ratio = 0.75
min_independent_correct = 1
required_target_groups = [
  ["say-my-preference"],
  ["say-their-preference"],
]
