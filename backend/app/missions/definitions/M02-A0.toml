mission_id = "M02"
practice_level = "A0"
content_version = 1
title = "Say where it is"

[photo_requirements]
media_sources = ["preloaded", "camera", "userUpload"]
min_confirmed_objects = 2
min_relations = 1
relations = ["on", "under", "next_to", "in_front_of", "behind"]

[objective]
objective_id = "locate-object"
can_do = "I can understand and build a simple sentence about where an object is."

[[objective.targets]]
target_id = "recognise-name"
summary = "Recognise the familiar object names used inside the location sentence."
evidence_types = ["recognition"]

[[objective.targets]]
target_id = "recognise-adjective"
summary = "Recognise a familiar visible detail when it appears in a description."
evidence_types = ["recognition"]

[[objective.targets]]
target_id = "recognise-preposition"
summary = "Recognise a familiar position word used between two object names."
evidence_types = ["recognition"]

[[objective.targets]]
target_id = "find-described-object"
summary = "Choose and build the location sentence that matches the photo."
evidence_types = ["recognition", "construction"]

[[language_patterns]]
pattern_id = "adjective-description"
target_id = "recognise-adjective"
structure = "[article] [adjective] [noun] / [article] [noun] [adjective]"
examples = { es = ["la taza roja"], fr = ["la tasse rouge"], de = ["die rote Tasse"], ko = ["빨간 컵"] }

[[language_patterns]]
pattern_id = "location-description"
target_id = "recognise-preposition"
structure = "[object] [position] [reference object]"
examples = { es = ["La taza está sobre la mesa."], fr = ["La tasse est sur la table."], de = ["Die Tasse steht auf dem Tisch."], ko = ["컵이 책상 위에 있어요."] }

[teaching]
task_sequence = ["vocabularyIntroduction", "grammarLesson"]
teach_before_assessment = ["recognise-preposition", "find-described-object"]
max_new_words = 3

[[teaching.supports]]
support = "translation"
availability = "onRequest"
counts_as_assistance = false

[[teaching.supports]]
support = "audio"
availability = "always"
counts_as_assistance = false

[[teaching.supports]]
support = "wordBank"
availability = "always"
counts_as_assistance = false

[[evaluation_criteria]]
criterion_id = "finds-described-object"
target_id = "find-described-object"
description = "Chooses or builds the sentence that matches a confirmed object relation."
evidence_types = ["recognition", "construction"]

[[evaluation_criteria]]
criterion_id = "preposition-matches-relation"
target_id = "recognise-preposition"
description = "Matches the taught position phrase to the confirmed object relation."
evidence_types = ["recognition"]

[expected_performance]
min_assessed_questions = 4
min_correct_ratio = 0.67
min_independent_correct = 2
required_target_groups = [
  ["recognise-preposition"],
  ["find-described-object"],
]
