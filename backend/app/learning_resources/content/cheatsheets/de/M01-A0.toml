mission_id = "M01"
practice_level = "A0"
content_version = 1
language_code = "de"
text_direction = "ltr"
title = "Name and identify"

[[concepts]]
concept_id = "recognise-name"
title = "Learn the article with the object"
explanation = "Keep the article and noun together when you learn a new word."

[[concepts.examples]]
target_text = "das Sofa (n)"
translation = "the sofa"

[[concepts.examples]]
target_text = "die Tasse (f)"
translation = "the cup"

[[concepts.examples]]
target_text = "der Laptop (m)"
translation = "the laptop"

[[concepts]]
concept_id = "identify-object"
title = "Say what the object is"
formula = "Das ist + ein/eine + object."

[[concepts.pattern_parts]]
part_id = "this-is"
label = "this is"
role = "fixed"
text = "Das ist"

[[concepts.pattern_parts]]
part_id = "article"
label = "article"
role = "choice"

[[concepts.pattern_parts.choices]]
text = "ein"
label = "masculine or neuter"

[[concepts.pattern_parts.choices]]
text = "eine"
label = "feminine"

[[concepts.pattern_parts]]
part_id = "object"
label = "object"
role = "slot"
text = "object"

[[concepts.examples]]
target_text = "Das ist ein Sofa."
translation = "This is a sofa."

[[concepts.examples]]
target_text = "Das ist eine Tasse."
translation = "This is a cup."
