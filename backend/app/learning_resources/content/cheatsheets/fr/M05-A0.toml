mission_id = "M05"
practice_level = "A0"
content_version = 1
language_code = "fr"
text_direction = "ltr"
title = "Say what you like and use negation"

[[concepts]]
concept_id = "say-preference"
section_id = "like-object"
title = "Positive: I like"
formula = "J'aime + object"

[[concepts.pattern_parts]]
part_id = "like"
label = "I like"
role = "fixed"
text = "J'aime"

[[concepts.pattern_parts]]
part_id = "object"
label = "object"
role = "slot"
text = "la pomme"

[[concepts.examples]]
target_text = "J'aime la pomme."
translation = "I like the apple."

[[concepts.examples]]
target_text = "Ana aime le livre."
translation = "Ana likes the book."

[[concepts]]
concept_id = "say-preference"
section_id = "dislike-object"
title = "Negative: ne ... pas"
explanation = "Put ne before the verb and pas after it. Before a vowel sound, ne shortens to n'."
formula = "subject + ne/n' + verb + pas + rest"

[[concepts.pattern_parts]]
part_id = "subject"
label = "subject"
role = "fixed"
text = "Je"

[[concepts.pattern_parts]]
part_id = "before-verb"
label = "before the verb"
role = "choice"

[[concepts.pattern_parts.choices]]
text = "ne"
label = "before a consonant"

[[concepts.pattern_parts.choices]]
text = "n'"
label = "before a vowel sound"

[[concepts.pattern_parts]]
part_id = "verb"
label = "verb"
role = "slot"
text = "aime"

[[concepts.pattern_parts]]
part_id = "after-verb"
label = "after the verb"
role = "fixed"
text = "pas"

[[concepts.pattern_parts]]
part_id = "rest"
label = "rest"
role = "slot"
text = "la pomme"

[[concepts.examples]]
target_text = "Je n'aime pas la pomme."
translation = "I don't like the apple."
note = "Aime begins with a vowel sound, so ne becomes n'."

[[concepts.examples]]
target_text = "Je ne choisis pas le livre."
translation = "I don't choose the book."
note = "Choisis begins with a consonant, so ne stays ne."
