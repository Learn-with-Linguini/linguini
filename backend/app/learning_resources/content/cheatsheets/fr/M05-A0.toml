[[concepts]]
concept_id = "say-preference"
section_id = "dislike-object"
title = "I don't like"
explanation = "Put n' before aime and pas after it. Ne shortens to n' before the vowel sound."
formula = "Je n'aime pas + object"

[[concepts.pattern_parts]]
part_id = "dislike"
label = "I don't like"
role = "fixed"
text = "Je n'aime pas"

[[concepts.pattern_parts]]
part_id = "object"
label = "object"
role = "slot"
text = "la pomme"

[[concepts.examples]]
target_text = "Je n'aime pas la pomme."
translation = "I don't like the apple."

[[concepts.examples]]
target_text = "Leo n'aime pas le livre."
translation = "Leo doesn't like the book."
