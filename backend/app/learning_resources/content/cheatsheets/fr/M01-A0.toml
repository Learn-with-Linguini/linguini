mission_id = "M01"
practice_level = "A0"
content_version = 1
language_code = "fr"
text_direction = "ltr"
title = "Name and identify in French"
summary = "Recognise an object's French name, ask what it is, and give a simple answer."

[[concepts]]
concept_id = "recognise-name"
title = "Learn the article with the object"
explanation = "French object names are taught with their article. Keep the article and noun together when you learn a new word."
tips = [
  "Le introduces many masculine nouns; la introduces many feminine nouns.",
  "Both le and la shorten to l' before a vowel sound, as in l'ordinateur and l'oreiller.",
]

[[concepts.examples]]
target_text = "le canapé"
translation = "the sofa"

[[concepts.examples]]
target_text = "l'ordinateur"
translation = "the computer"
note = "The article shortens to l' before the vowel sound."

[[concepts.examples]]
target_text = "l'oreiller"
translation = "the pillow"
note = "The article shortens to l' before the vowel sound."

[[concepts]]
concept_id = "identify-object"
title = "Say what the object is"
explanation = "Start with C'est, choose un or une to match the noun, then add the object name."
formula = "C'est + un/une + object."
tips = [
  "Use un with a masculine noun and une with a feminine noun.",
  "Ask Qu'est-ce que c'est ? when you want to know what something is.",
  "To check a guess, raise your voice at the end: C'est un oreiller ? Answer Oui or Non.",
]

[[concepts.pattern_parts]]
part_id = "this-is"
label = "this is"
role = "fixed"
text = "C'est"

[[concepts.pattern_parts]]
part_id = "article"
label = "article"
role = "choice"

[[concepts.pattern_parts.choices]]
text = "un"
label = "masculine"

[[concepts.pattern_parts.choices]]
text = "une"
label = "feminine"

[[concepts.pattern_parts]]
part_id = "object"
label = "object"
role = "slot"
text = "object"

[[concepts.examples]]
target_text = "C'est un oreiller."
translation = "This is a pillow."

[[concepts.examples]]
target_text = "C'est un ordinateur."
translation = "This is a computer."

[[concepts.examples]]
target_text = "C'est une tasse."
translation = "This is a cup."
note = "Tasse is feminine, so it uses une."
