[[concepts]]
concept_id = "number-noun-chunk"
title = "Put the object before the number and counter"
explanation = "The object does not change to a plural form. Use 개 to count objects."
formula = "object + number + 개"
tips = ["하나, 둘, 셋, 넷 become 한, 두, 세, 네 before a counter."]

