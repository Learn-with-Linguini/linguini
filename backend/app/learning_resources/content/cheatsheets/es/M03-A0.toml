[[concepts]]
concept_id = "number-noun-chunk"
title = "Use a plural object after two or more"
explanation = "The number comes before the object."
formula = "number + object"
tips = [
  "After a vowel, usually add -s: taza → tazas.",
  "After a consonant, usually add -es: color → colores.",
]

[[concepts.examples]]
target_text = "una taza"
translation = "one cup"

[[concepts.examples]]
target_text = "dos tazas"
translation = "two cups"

[[concepts.examples]]
target_text = "tres tazas"
translation = "three cups"
