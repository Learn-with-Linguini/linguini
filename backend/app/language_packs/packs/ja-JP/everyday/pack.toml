[language]
articles = "none"
grammatical_gender = "none"
phrase_boundaries = ["そして", "でも"]
romanization_required = true
inflection = "suffixing"
romanization_convention = "Modified Hepburn with macrons (ā ī ū ē ō), shi/chi/tsu/fu/ji, n before consonants and n' before a vowel or y when needed. Particles は/へ/を are wa/e/o. Read kanji in context, including irregular number-counter readings (一本 ippon, 三本 sanbon, 一杯 ippai, 一冊 issatsu); never infer readings from characters independently. Phrase-unit learning spaces and ASCII punctuation are intentional. Align each complete native sentence in native/Latin spans; a number and counter may share a span when their reading fuses. Retain conventional ei/ii sequences in words such as tokei, kiiroi and midoriiro; the style is Hepburn-based learner romanization."
code = "ja"
locale = "ja-JP"
script = "Jpan"
direction = "ltr"
word_separator = "space"

[language.speech]
synthesis_locale = "ja-JP"
synthesis = "browserVoice"
recognition = false

[variety]
variety_id = "ja-jp"
description = "Contemporary standard Japanese as used in Japan; common daily-life vocabulary."

[register]
register_id = "everyday"
description = "Everyday polite present です/ます Japanese. Learner-display spacing between phrase units, attached particles/copulas, separated number/counter tokens and ASCII punctuation for dev compatibility. These spaces are not ordinary written Japanese."

