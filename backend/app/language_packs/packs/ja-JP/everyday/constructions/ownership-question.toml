construction_id = "ownership-question"
version = 1
summary = "Ask whether the object belongs to the listener."
guidance = "Use これは あなたの 物ですか? This explicitly identifies the listener in the role-play. In real conversation a known name plus さんの or simply これ, どなたのですか? can be more natural; do not invent a name. The object is contextual and need not be named. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "ownership-question"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = []
