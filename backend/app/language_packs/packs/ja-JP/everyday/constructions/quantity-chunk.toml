construction_id = "quantity-chunk"
version = 1
summary = "Give a noun and its quantity as a chunk."
guidance = "Write N NUMBER COUNTER without punctuation: りんご 二 個. Use the bound number as a separate learning token and the noun-appropriate counter. No plural suffix is added to Japanese nouns. Counter readings depend on the number: 一本 ippon, 二本 nihon, 三本 sanbon; 一杯 ippai, 二杯 nihai, 三杯 sanbai; 一冊 issatsu, 八冊 hassatsu, 十冊 jussatsu. This spacing is pedagogical, not normal Japanese orthography. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels.  With the generic つ series, ten is 十 (とお, tō) alone, never 十つ. Ask いくつ, not 何つ."
features = ["polite-japanese", "learner-spacing", "quantity-chunk"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = []
roles = { "object" = "noun", "count" = "determiner" }
