construction_id = "scene-existence"
version = 2
summary = "State whether a visible inanimate object exists in the scene."
guidance = "Use Nが あります. with an optional confirmed modifier before N. Use Nは ありません. for a deliberately absent item. These examples are inanimate: use います / いません for a living person or animal when the open scene vocabulary requires it. Do not infer absence from detector omission. Existential ある and animate いる are not interchangeable. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "scene-existence"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = ["touch-object"]
roles = { "object" = "noun", "attribute" = "adjective" }
provenance = { "source" = "Original AI-authored Japanese learning content, 2026-10-28. Schema and mission coverage adapted from dev c2a11b6a727a0f1eafa1abeb5618ee1539494dec. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete tasks end with ASCII sentence punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "existence-negative"
message = "Negate the existence of the absent item."
must_contain = ["(ありません|いません)[.]$"]
truth = false
except_uses = ["falseFirst"]
