construction_id = "identify-object"
version = 2
summary = "Identify a visible object; bare noun labels are separate from sentences."
guidance = "For name use write only the bare noun, with no copula or punctuation. For identity use Nです. or これは Nです. Do not invent articles or grammatical gender. Example: コップです. Do not use the plain だ in this polite present register. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "identify-object"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = ["what-is-this"]
roles = { "object" = "noun" }
provenance = { "source" = "Original AI-authored Japanese learning content, 2026-10-28. Schema and mission coverage adapted from dev c2a11b6a727a0f1eafa1abeb5618ee1539494dec. Not human-reviewed.", "review_status" = "generated" }
templates = { "find" = "{name}を 探してください." }

[[checks]]
check_id = "sentence-ending"
message = "Use the polite present identity ending."
must_contain = ["です[.]$"]
except_uses = ["name"]

[[checks]]
check_id = "bare-name"
message = "Name chunks have no copula or punctuation."
must_not_contain = ["(です|だ|[.?!])$"]
uses = ["name"]
