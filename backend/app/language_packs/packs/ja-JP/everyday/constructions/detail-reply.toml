guidance = "Use detail + お願いします., choosing a natural particle: 持ち帰りで お願いします.; 青で お願いします.; 小さいので お願いします.; 温かいので お願いします. Realize the bound detail, never another field or value. Do not name the contextual item unless the spec explicitly binds it as a realized noun. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "detail-reply"]
constraints = [
