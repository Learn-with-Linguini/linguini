construction_id = "order-repair"
version = 1
summary = "Politely correct one repeated order detail."
guidance = "Start いいえ, then the corrected bound value and お願いします. For quantity, e.g. 三 杯で お願いします.; for service setting 持ち帰りで お願いします. Only the value being corrected is bound. Do not confirm the mistake, introduce a new item or silently change another detail. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "order-repair"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = []
roles = { "quantity" = "determiner", "size" = "phrase", "detail" = "phrase" }
provenance = { "source" = "Original AI-authored Japanese learning content, 2026-10-28. Schema and mission coverage adapted from dev c2a11b6a727a0f1eafa1abeb5618ee1539494dec. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete tasks end with ASCII sentence punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "repair-frame"
message = "Reject the mistaken repeat and request the correct detail."
must_contain = ["^いいえ", "お願いします[.]$"]
