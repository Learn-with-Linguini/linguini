construction_id = "scene-location"
version = 2
summary = "Locate an object relative to another."
guidance = "Use subjectは referenceの position あります. e.g. コップは テーブルの 上に あります. Ask subjectは どこに ありますか? for a followup; keep the reference/detail out of the question. Inanimate あります and animate います depend on the subject. Spatial 上に etc. are a relation term. Referenceの is the reference noun plus の, not a new object. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "scene-location"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = ["build-second-fact"]
roles = { "subject" = "noun", "reference" = "noun", "relation" = "preposition" }
provenance = { "source" = "Original AI-authored Japanese learning content, 2026-10-28. Schema and mission coverage adapted from dev c2a11b6a727a0f1eafa1abeb5618ee1539494dec. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete tasks end with ASCII sentence punctuation."
must_contain = ["[.?!]$"]

[[checks]]
