summary = "State two confirmed group quantities."
guidance = "Use firstが NUMBER COUNTER, secondが NUMBER COUNTER あります. e.g. 本が 五 冊, コップが 二 個 あります. Both bound counts and nouns must appear. Select each counter independently and use number-counter readings. Do not add a plural suffix. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels.  With the generic つ series, ten is 十 (とお, tō) alone, never 十つ. Ask いくつ, not 何つ."
features = ["polite-japanese", "learner-spacing", "quantity-pair"]
