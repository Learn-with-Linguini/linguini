construction_id = "yes-no-identification"
version = 1
summary = "Ask or answer a positive identity question."
guidance = "Ask Nですか? For answers use はい, Nです. when true; use いいえ, Nです. with the actual shown noun for a correcting reply. A0 short choice labels may be はい. and いいえ. Truth means the asked noun agrees with the shown object; never assert a mismatched noun as true. Use the pack display convention consistently: one ASCII space between phrase units; keep particles/copulas attached to their word (コップは, 本です), separate number and counter (五 冊), and use ASCII . ? , in sentence tasks. This is learning-display spacing, not ordinary Japanese orthography. Supply aligned native/Latin spans; Hepburn uses wa for は, e for へ, o for を, and macrons for long vowels. "
features = ["polite-japanese", "learner-spacing", "yes-no-identification"]
constraints = [
  "Preserve every planned semantic binding and truth value.",
  "Use only confirmed or explicitly assigned scene/role-play facts.",
  "Romanization supports native text; it is not an alternative grading answer.",
]
required_labels = ["yes", "no", "yes-answer", "no-answer"]
roles = { "object" = "noun", "shown" = "noun" }
provenance = { "source" = "Original AI-authored Japanese learning content, 2026-10-28. Schema and mission coverage adapted from dev c2a11b6a727a0f1eafa1abeb5618ee1539494dec. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete tasks end with ASCII sentence punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "identity-question"
message = "A positive identity question ends in ですか?"
must_contain = ["ですか[?]$"]
uses = ["question", "prompt"]

[[checks]]
check_id = "polite-identity"
message = "Use the polite identity copula."
must_contain = ["です[.]$"]
uses = ["answer", "option"]
