construction_id = "scene-existence"
version = 2
summary = "State presence or explicit absence."
guidance = "Use 有 modifier N. or simply 有 N. for a confirmed item. For a deliberately absent object use 没有 N., not 不有. Do not infer absence from detector omission. Optional modifiers precede the noun and take 的 where appropriate; assert only selected facts. Display Hanzi with one ASCII learning space between word/phrase units and ASCII . ? , for dev compatibility; this is not ordinary Chinese orthography. Supply exact aligned Hanzi/pinyin spans. Pinyin uses lexical tones, neutral syllables without tone marks, ü (not v), and NFC Latin text. Keep lexical yī and bù in writing; explain spoken tone changes separately. "
features = ["mandarin", "simplified-script", "scene-existence"]
constraints = [
  "Preserve selected semantic role bindings, truth and assigned role-play facts.",
  "Use simplified Hanzi and the declared neutral polite register.",
  "Pinyin is a support, not an alternative grading answer.",
]
required_labels = ["touch-object"]
roles = { "object" = "noun", "attribute" = "adjective" }
provenance = { "source" = "Original AI-authored Simplified Mandarin teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete task sentences need ASCII final punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "negate-you"
message = "Negate existence with 没有, not 不有."
must_not_contain = ["不\\s*有"]

[[checks]]
check_id = "absent-item"
message = "An absent-item sentence uses 没有."
must_contain = ["没有\\s"]
truth = false
except_uses = ["falseFirst"]
