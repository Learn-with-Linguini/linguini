construction_id = "my-preference"
version = 1
summary = "Express the learner's preference."
guidance = "Use 我 喜欢 N. / 我 不 喜欢 N. 喜欢 is a transitive verb here; put the noun after it. use=like is affirmative, use=dislike is negative. Preserve the planned polarity. 不喜欢 is not the stronger 讨厌. Display Hanzi with one ASCII learning space between word/phrase units and ASCII . ? , for dev compatibility; this is not ordinary Chinese orthography. Supply exact aligned Hanzi/pinyin spans. Pinyin uses lexical tones, neutral syllables without tone marks, ü (not v), and NFC Latin text. Keep lexical yī and bù in writing; explain spoken tone changes separately. "
features = ["mandarin", "simplified-script", "my-preference"]
constraints = [
  "Preserve selected semantic role bindings, truth and assigned role-play facts.",
  "Use simplified Hanzi and the declared neutral polite register.",
  "Pinyin is a support, not an alternative grading answer.",
]
required_labels = []
roles = { "object" = "noun" }
provenance = { "source" = "Original AI-authored Simplified Mandarin teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete task sentences need ASCII final punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "like"
message = "A like statement is affirmative."
must_contain = ["\\s喜欢\\s"]
must_not_contain = ["\\s不\\s"]
uses = ["like"]

[[checks]]
check_id = "dislike"
message = "A dislike statement uses 不 喜欢."
must_contain = ["\\s不\\s喜欢\\s"]
uses = ["dislike"]
