construction_id = "quantity-statement"
version = 1
summary = "State or correct an exact count."
guidance = "Use 有 NUMBER CLASSIFIER N. e.g. 有 五 本 书. A correction starts 不对, followed by the confirmed count. Use 两 in counting phrases for two; classifiers are 本 for books, 把 for keys/handled utensils/chairs, 张 for tables, 台 for devices, 盏 for lamps, 支 for pens, 个 for general objects. Drinks take 杯. Do not silently count shoe pairs when the learner counted individual shoes. Display Hanzi with one ASCII learning space between word/phrase units and ASCII . ? , for dev compatibility; this is not ordinary Chinese orthography. Supply exact aligned Hanzi/pinyin spans. Pinyin uses lexical tones, neutral syllables without tone marks, ü (not v), and NFC Latin text. Keep lexical yī and bù in writing; explain spoken tone changes separately. "
features = ["mandarin", "simplified-script", "quantity-statement"]
constraints = [
  "Preserve selected semantic role bindings, truth and assigned role-play facts.",
  "Use simplified Hanzi and the declared neutral polite register.",
  "Pinyin is a support, not an alternative grading answer.",
]
required_labels = []
roles = { "object" = "noun", "count" = "determiner" }
provenance = { "source" = "Original AI-authored Simplified Mandarin teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete task sentences need ASCII final punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "quantity-frame"
message = "A counted existence statement uses 有."
must_contain = ["(^|\\s)有\\s"]
