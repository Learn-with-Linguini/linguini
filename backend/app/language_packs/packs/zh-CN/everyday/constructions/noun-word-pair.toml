construction_id = "noun-word-pair"
version = 1
summary = "Choose the noun-identity frame for an object."
guidance = "Use 这是 N as an unpunctuated teaching chunk, e.g. 这是 杯子. The alternative 这很 is an adjective-degree frame and is wrong before the concrete object nouns in this noun-identity task. Mandarin has no gendered articles. Do not use classifier choices as allegedly unique answers: multiple classifiers may be valid for a noun. Classifiers are taught in M03/M06. Preserve the same bare noun in the two frame choices. Display Hanzi with one ASCII learning space between word/phrase units and ASCII . ? , for dev compatibility; this is not ordinary Chinese orthography. Supply exact aligned Hanzi/pinyin spans. Pinyin uses lexical tones, neutral syllables without tone marks, ü (not v), and NFC Latin text. Keep lexical yī and bù in writing; explain spoken tone changes separately. "
features = ["mandarin", "simplified-script", "noun-word-pair"]
constraints = [
  "Preserve selected semantic role bindings, truth and assigned role-play facts.",
  "Use simplified Hanzi and the declared neutral polite register.",
  "Pinyin is a support, not an alternative grading answer.",
]
required_labels = []
roles = { "object" = "noun" }
provenance = { "source" = "Original AI-authored Simplified Mandarin teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "chunk-punctuation"
message = "A phrase has no final sentence punctuation."
must_not_contain = ["[.?!]$"]

[[checks]]
check_id = "noun-identity-frame"
message = "Use 这是 before the concrete object noun."
must_contain = ["^这是\\s"]
