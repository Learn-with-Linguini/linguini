summary = "Ask where an object is."
guidance = "Ask where the object is: Wo ist + nominative noun phrase + ? (Wo ist die Tasse?). The verb comes second."
features = ["where-question"]
constraints = ["Express only the selected scene facts and preserve role bindings.", "Treat these rules as generation guidance, not a grammar validator."]
required_labels = []
