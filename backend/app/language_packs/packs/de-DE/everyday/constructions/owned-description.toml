guidance = "Start with the agreeing possessive and the noun, then ist + the detail or the location (dative): Meine Tasse ist rot. Meine Tasse ist auf dem Tisch."
features = ["ownership", "possessive-determiner"]
constraints = ["Express only the selected scene facts and preserve role bindings.", "Treat these rules as generation guidance, not a grammar validator."]
