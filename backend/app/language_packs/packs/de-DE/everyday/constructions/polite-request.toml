construction_id = "polite-request"
version = 1
summary = "Ask politely for the ordered item and quantity."
guidance = "A polite request for the bound item in the accusative: einen/eine/ein for one, the size before the noun with its ending (einen kleinen Kaffee, zwei kleine Kaffees), the plural after zwei or drei. Use order: Ich hätte gern … , bitte. Use borrow: Kannst du mir bitte … leihen? Use pass: Kannst du mir bitte … geben?"
features = ["request", "quantity"]
constraints = ["Express only the bound order facts and preserve role bindings.", "Treat these rules as generation guidance, not a grammar validator."]
required_labels = []
roles = { object = "noun", quantity = "determiner", size = "phrase" }
provenance = { source = "AI-authored original Linguini M06 draft, 2026-10-23; not human-reviewed.", review_status = "generated" }

[[checks]]
check_id = "polite-tail"
message = "A request says bitte."
must_contain = ["\\bbitte\\b"]

[[checks]]
check_id = "asks-not-states"
message = "A request asks; it never says what you have or what there is."
must_not_contain = ["^(ich habe|es gibt)\\b"]

[[checks]]
check_id = "question-mark"
message = "A Kannst du…? request is a question."
must_contain = ["^kannst du\\b", "\\?$"]
uses = ["borrow", "pass"]
