construction_id = "describe-attribute"
templates = { word_order_feedback = "Keep the verb in its clause position; use the article, case and adjective ending shown." }
version = 2
summary = "Describe a colour with correct attributive or predicative form."
guidance = "After Das ist, use nominative ein/eine with an attributive adjective before the noun: eine rote Tasse, ein grünes Buch, ein schwarzer Schuh. Singular mixed endings here are feminine -e, neuter -es, masculine -er. A predicative alternative is Das Buch ist grün: the predicative adjective has no such ending. A colour-name option may be Rot/Grün/Blau. Do not reuse an attributive surface as a universal lemma. Ask Welche Farbe hat… ? with hat agreeing with the singular subject."
features = ["mixed-adjective-inflection", "predicative-adjective", "nominative"]
constraints = ["Express only the selected scene facts and preserve semantic role bindings.", "Use the declared variety/register and approved surfaces.", "Treat these rules as generation guidance; they do not constitute a grammar validator."]
required_labels = ["attribute-prompt-colour", "describe-object"]
roles = { object = "noun", attribute = "adjective" }
provenance = { source = "AI-authored original Linguini M01 draft, 2026-10-19; not human-reviewed. See SOURCES.md for background references, not sentence endorsements.", review_status = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete sentences end with . ? or !."
must_contain = ["[.?!]$"]
except_uses = ["name"]

[[checks]]
check_id = "question-mark"
message = "Questions end with ?."
must_contain = ["\\?$"]
uses = ["followup"]

[[checks]]
check_id = "describe-verb"
message = "Descriptions use sein (ist)."
must_contain = ["\\bist\\b"]
uses = ["answer"]

[[checks]]
check_id = "detail-question"
message = "A detail follow-up asks about the detail itself, not where the object is (wo belongs to the location question)."
must_not_contain = ["(^| )wo "]
uses = ["followup"]
