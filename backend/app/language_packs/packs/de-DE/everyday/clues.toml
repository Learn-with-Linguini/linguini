article = "dem"
text = "beim"

[[positions]]
text = "auf"
meaning = "on"
example = "Das Buch ist auf dem Tisch."

[[positions]]
text = "unter"
meaning = "under"
example = "Die Katze ist unter dem Stuhl."

[[positions]]
text = "neben"
meaning = "next to"
example = "Der Stuhl ist neben der Tür."

[[positions]]
text = "vor"
meaning = "in front of"
example = "Der Hund ist vor dem Haus."

[[positions]]
text = "hinter"
meaning = "behind"
example = "Der Baum ist hinter dem Haus."

