[[articles]]
agreement = "neuter"
text = "das"

# After a position the reference takes the dative article.
[[place_articles]]
agreement = "masculine"
text = "dem"

[[place_articles]]
agreement = "feminine"
text = "der"

[[place_articles]]
agreement = "neuter"
