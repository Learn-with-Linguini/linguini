# The closed grammar guided I-Spy clue frames and photo-room clues are built from.
provenance = { source = "Moved unchanged from dev's hand-written I-Spy clue tables (app/services/ispy_clue_frames.py), 2026-10-25; not human-reviewed.", review_status = "unreviewed" }
place = "{position} {reference}"
location_verb_starts = ["ist", "er ist", "sie ist", "es ist"]

[examples]
colour = "Der Apfel ist rot."
location = "Das Buch ist auf dem Tisch."

[[prefixes]]
frame = "colour"
agreement = "masculine"
text = "Er ist"

[[prefixes]]
