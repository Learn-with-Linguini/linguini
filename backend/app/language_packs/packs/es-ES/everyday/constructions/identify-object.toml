construction_id = "identify-object"
version = 1
summary = "Name an object or identify what it is."
guidance = """Spanish nouns are masculine or feminine, and the article must match the noun's stored gender, not a guess from its ending (el mapa, la mano, el reloj, la llave). To name an object as a vocabulary chunk, use the definite article: el libro, la taza; no capital letter or final punctuation. To say what something is, use Es + indefinite article + noun + full stop: Es un libro. / Es una taza. un goes with masculine nouns and una with feminine ones. Spanish normally drops the subject, so do not add él, ella or eso. Esto es una taza. is an accepted alternative; the taught pattern is Es… Use ser (es) to identify, never está."""
features = ["definite-article", "indefinite-article", "grammatical-gender", "copula-ser"]
constraints = ["Article gender comes from the approved noun.", "Identification sentences use es, not está.", "Name chunks use the definite article and no final punctuation."]
required_labels = ["what-is-this"]

[provenance]
source = "Lead-authored; needs fluent Spanish review."
review_status = "unreviewed"
