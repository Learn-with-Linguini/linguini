# The closed grammar guided I-Spy clue frames and photo-room clues are built from.
provenance = { source = "Moved unchanged from dev's hand-written I-Spy clue and photo-room tables (app/services/ispy_clue_frames.py, room_clues.py), 2026-10-25; not human-reviewed.", review_status = "unreviewed" }
place = "{position} {reference}"
conjunction = "y"
location_verb_starts = ["está", "es"]

[examples]
colour = "La manzana es roja."
location = "El libro está sobre la mesa."

[[prefixes]]
frame = "colour"
text = "Es"

[[prefixes]]
frame = "location"
text = "Está"

[[articles]]
agreement = "masculine"
text = "el"

[[articles]]
agreement = "feminine"
text = "la"

[[contractions]]
preposition = "de"
article = "el"
text = "del"

[[contractions]]
preposition = "a"
article = "el"
text = "al"

[[positions]]
text = "sobre"
meaning = "on"
example = "El libro está sobre la mesa."

[[positions]]
text = "debajo de"
meaning = "under"
example = "El gato está debajo de la silla."

[[positions]]
text = "al lado de"
meaning = "next to"
example = "La silla está al lado de la puerta."

[[positions]]
text = "delante de"
meaning = "in front of"
example = "El perro está delante de la casa."

[[positions]]
text = "detrás de"
meaning = "behind"
example = "El árbol está detrás de la casa."

