# The closed grammar guided I-Spy clue frames and photo-room clues are built from.
provenance = { source = "Moved unchanged from dev's hand-written I-Spy clue tables (app/services/ispy_clue_frames.py), 2026-10-25; not human-reviewed.", review_status = "unreviewed" }
# Korean names the reference bare, before its position: 책상 위에 있어요.
place = "{reference} {position} 있어요"

[examples]
colour = "사과는 빨간색이에요."
location = "책이 책상 위에 있어요."

[[prefixes]]
frame = "colour"
text = "이것은"

[[prefixes]]
frame = "location"
text = "이것은"

[[positions]]
text = "위에"
meaning = "on"
example = "책이 책상 위에 있어요."

[[positions]]
text = "아래에"
meaning = "under"
example = "고양이가 의자 아래에 있어요."

[[positions]]
text = "옆에"
meaning = "next to"
example = "의자가 문 옆에 있어요."

[[positions]]
text = "앞에"
meaning = "in front of"
example = "개가 집 앞에 있어요."

[[positions]]
text = "뒤에"
meaning = "behind"
example = "나무가 집 뒤에 있어요."

# A colour is said whole (빨간색이에요). A translated colour matches by the spellings
# it is written in; the whole form itself is not one of them.
