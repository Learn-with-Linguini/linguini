construction_id = "connected-description"
version = 2
summary = "Connect selected scene facts using natural Tamil coordination."
guidance = "Tamil can attach -உம் to coordinated nouns: கோப்பையும் புத்தகமும். Use approved combined forms rather than splitting the suffix into a separate tile. A simple A2 description can also use two short complete sentences, each preserving the selected fact. This pack uses இருக்கு consistently for the drafted inanimate spoken scene sentences; plural/coordination acceptability and regional usage require fluent review. Do not force Spanish y + repeated copula order, and do not invent a spatial relationship between two objects just because both are mentioned."
features = ["additive-um", "suffix-integrity", "spoken-coordination"]
constraints = ["Express only the selected scene facts and preserve semantic role bindings.", "Use the declared variety/register and approved surfaces.", "Treat these rules as generation guidance; they do not constitute a grammar validator."]
required_labels = ["choose-description", "describe-scene", "connector-distractor"]
# Role categories match the shared semantic-slot contract; native word order is in guidance.
roles = { object = "noun", other-object = "noun", subject = "noun", reference = "noun", attribute = "adjective", relation = "preposition" }
provenance = { source = "AI-authored original Linguini M01 draft, 2026-10-19; not human-reviewed. See SOURCES.md for background references, not sentence endorsements.", review_status = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete sentences end with . ? or !."
must_contain = ["[.?!]$"]
except_uses = ["name"]

[[checks]]
check_id = "spoken-register"
message = "Use the pack's spoken forms (இருக்கு), not formal இருக்கிறது."
must_not_contain = ["இருக்கிறது|இருக்கின்றது|இருக்கின்றன"]

[[checks]]
check_id = "denied-existence"
message = "The false existence option denies the object with இல்லை."
must_contain = ["இல்லை"]
uses = ["wrongExistence"]
