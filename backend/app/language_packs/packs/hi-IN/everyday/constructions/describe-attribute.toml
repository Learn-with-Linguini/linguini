construction_id = "describe-attribute"
version = 2
summary = "Describe a confirmed detail and ask about it."
guidance = "Adjectives precede the noun in यह हरी किताब है. or occur predicatively as किताब हरी है. Marked adjectives agree: हरा/हरी/हरे, नीला/नीली/नीले, पीला/पीली/पीले, काला/काली/काले. लाल and सफ़ेद are invariant. Followup asks N किस रंग का/की है? with the noun's gender, without revealing the colour. Bare colour choices use the noun-appropriate predicative form. Use ordinary Hindi word spacing and ASCII . ? , in task strings for the current app contract. Require gender and direct/oblique forms for translated nouns where relevant. Supply exactly aligned Devanagari/Latin spans; native Hindi remains the answer and TTS input. Respect noun agreement, Unicode NFC and the declared polite register. "
features = ["standard-hindi", "devanagari", "describe-attribute"]
constraints = [
  "Preserve all selected semantic roles, truth and assigned role-play facts.",
  "Use polite आप-level requests and avoid guessing the learner's gender.",
  "Transliteration is display support, not an alternate answer key.",
]
required_labels = ["attribute-prompt-colour", "describe-object"]
roles = { "object" = "noun", "attribute" = "adjective" }
provenance = { "source" = "Original AI-authored Hindi teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete task sentences need ASCII final punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "colour-followup"
message = "Ask the detail rather than stating its answer."
must_contain = ["किस\\sरंग", "[?]$"]
uses = ["followup"]
