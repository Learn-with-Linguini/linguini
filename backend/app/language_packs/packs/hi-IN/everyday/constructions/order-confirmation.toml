construction_id = "order-confirmation"
version = 1
summary = "Confirm a correct order."
guidance = "Use हाँ, सही है. / हाँ, बिल्कुल सही है. Do not introduce unbound quantities, items or details. A repair must not replace a confirmation. Use ordinary Hindi word spacing and ASCII . ? , in task strings for the current app contract. Require gender and direct/oblique forms for translated nouns where relevant. Supply exactly aligned Devanagari/Latin spans; native Hindi remains the answer and TTS input. Respect noun agreement, Unicode NFC and the declared polite register. "
features = ["standard-hindi", "devanagari", "order-confirmation"]
constraints = [
  "Preserve all selected semantic roles, truth and assigned role-play facts.",
  "Use polite आप-level requests and avoid guessing the learner's gender.",
  "Transliteration is display support, not an alternate answer key.",
]
required_labels = []
roles = {  }
