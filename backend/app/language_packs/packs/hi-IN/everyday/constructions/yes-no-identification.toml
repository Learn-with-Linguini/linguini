construction_id = "yes-no-identification"
version = 1
summary = "Ask or answer an identity question."
guidance = "Ask क्या यह N है? For a labelled correction say हाँ, यह N है. / नहीं, यह N है., naming the actual shown object in the correcting answer. A0 may use the fixed short labels हाँ./नहीं. Follow the bound asked/shown identities and truth value. Use ordinary Hindi word spacing and ASCII . ? , in task strings for the current app contract. Require gender and direct/oblique forms for translated nouns where relevant. Supply exactly aligned Devanagari/Latin spans; native Hindi remains the answer and TTS input. Respect noun agreement, Unicode NFC and the declared polite register. "
features = ["standard-hindi", "devanagari", "yes-no-identification"]
constraints = [
  "Preserve all selected semantic roles, truth and assigned role-play facts.",
  "Use polite आप-level requests and avoid guessing the learner's gender.",
  "Transliteration is display support, not an alternate answer key.",
]
required_labels = ["yes", "no", "yes-answer", "no-answer"]
roles = { "object" = "noun", "shown" = "noun" }
provenance = { "source" = "Original AI-authored Hindi teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete task sentences need ASCII final punctuation."
must_contain = ["[.?!]$"]

[[checks]]
check_id = "identity-question"
message = "A neutral yes/no identity question begins क्या and ends है?."
must_contain = ["^क्या\\s", "\\sहै[?]$"]
uses = ["question", "prompt"]
