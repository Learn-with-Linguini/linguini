construction_id = "identify-object"
version = 2
summary = "Name or identify an object."
guidance = "A name use is the bare singular noun, no punctuation: किताब. Identity is यह कप है. / यह एक कप है. Use है for a single inanimate object; Hindi has no gendered articles. Keep Devanagari canonical and Latin transliteration separate. Use ordinary Hindi word spacing and ASCII . ? , in task strings for the current app contract. Require gender and direct/oblique forms for translated nouns where relevant. Supply exactly aligned Devanagari/Latin spans; native Hindi remains the answer and TTS input. Respect noun agreement, Unicode NFC and the declared polite register. "
features = ["standard-hindi", "devanagari", "identify-object"]
constraints = [
  "Preserve all selected semantic roles, truth and assigned role-play facts.",
  "Use polite आप-level requests and avoid guessing the learner's gender.",
  "Transliteration is display support, not an alternate answer key.",
]
required_labels = ["what-is-this"]
roles = { "object" = "noun" }
provenance = { "source" = "Original AI-authored Hindi teaching content, 2026-10-29. Mission semantic fixture structure adapted from Linguini dev 0104503cfbf11352a7441c05568d5628ead21542. Not human-reviewed.", "review_status" = "generated" }
templates = { "find" = "{name} ढूँढ़िए." }

[[checks]]
check_id = "identity-copula"
message = "A singular identity clause ends in है."
must_contain = ["\\sहै[.]$"]
except_uses = ["name"]

[[checks]]
check_id = "bare-name"
message = "A vocabulary name has no sentence punctuation."
must_not_contain = ["[.?!]$"]
uses = ["name"]
