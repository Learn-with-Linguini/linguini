romanization_convention = "Consistent learner-readable scholarly Hindi transliteration: ā ī ū for long vowels, ṭ ḍ ṇ for retroflex letters, ṛ/ṛh for ड़/ढ़, c/ch for च/छ, ś/ṣ for श/ष, z/f for nukta ज़/फ़. ṃ marks nasalization; it is not an extra spoken m in maiṃ, haiṃ or nahīṃ. ô denotes the borrowed open-o vowel (ॉ) in कॉफ़ी, without claiming that it is phonemically short. Reflect modern Hindi schwa deletion (कप kap, not kapa; पसंद pasaṃd, not pasamda). Preserve Hindi words, natural word spacing and exact punctuation in aligned Devanagari/Latin spans. This is transliteration with contextual readings, not English-sound respelling or a machine-by-character decoder. Vocalic ऋ is r̥ in कृपया kr̥payā; retroflex ड़ remains ṛ. This avoids conflating the two in the scholarly learner notation."
