construction_id = "polite-request"
version = 1
summary = "Ask politely for the ordered item and quantity."
guidance = "A polite request for the bound item: the quantity (un/une by gender for one), the size before the noun when bound (petit, grand, agreeing), the noun (plural after deux or trois). Use order: Je voudrais … , s'il vous plaît. Use borrow: Tu peux me prêter … , s'il te plaît ? Use pass: Tu peux me passer … , s'il te plaît ? Put a space before ? ."
features = ["request", "quantity"]
constraints = ["Express only the bound order facts and preserve role bindings.", "Treat these rules as generation guidance, not a grammar validator."]
required_labels = []
roles = { object = "noun", quantity = "determiner", size = "phrase" }
provenance = { source = "AI-authored original Linguini M06 draft, 2026-10-23; not human-reviewed.", review_status = "generated" }

[[checks]]
check_id = "polite-tail"
message = "A request says s'il vous plaît or s'il te plaît."
must_contain = ["s'il (vous|te) plaît"]

[[checks]]
check_id = "asks-not-states"
message = "A request asks; it never says what you have or what there is."
must_not_contain = ["^(j'ai|il y a)\\b"]

[[checks]]
check_id = "question-mark"
message = "A Tu peux… request ends with a spaced question mark."
must_contain = [" \\?$"]
uses = ["borrow", "pass"]
