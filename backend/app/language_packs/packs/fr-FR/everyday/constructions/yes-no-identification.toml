construction_id = "yes-no-identification"
templates = { question = "C'est {noun} ?", sentence_start = "C'est" }
version = 2
summary = "Ask a positive identity question and answer it."
guidance = "Use C'est + un/une + noun + ? for the everyday positive question. A0 answers are the fixed short Oui./Non. A1 answer options may include Oui, c'est… or Non, c'est… and must name the shown object, not blindly repeat the noun in a false question. Restrict this pilot to positive identity questions: negative questions can require si and need additional reviewed handling. The question’s article agrees with its own noun. Prompt labels are distinct from yes/no words inside a sentence."
features = ["positive-question", "yes-no-answer", "article-agreement"]
constraints = ["Express only the selected scene facts and preserve semantic role bindings.", "Use the declared variety/register and approved surfaces.", "Treat these rules as generation guidance; they do not constitute a grammar validator."]
required_labels = ["yes", "no", "yes-answer", "no-answer"]
roles = { object = "noun", shown = "noun" }
provenance = { source = "AI-authored original Linguini M01 draft, 2026-10-19; not human-reviewed. See SOURCES.md for background references, not sentence endorsements.", review_status = "generated" }

[[checks]]
check_id = "final-punctuation"
message = "Complete sentences end with . ? or !."
must_contain = ["[.?!]$"]
except_uses = ["name"]

[[checks]]
check_id = "question-mark"
message = "French questions end with a space and ?."
must_contain = [" \\?$"]
uses = ["question", "prompt", "followup"]

[[checks]]
check_id = "elision"
message = "Elide le/la/de/ne/que/ce before a vowel (l', d', n', qu', c')."
must_not_contain = ["(^|\\s)(le|la|de|ne|que|ce) [aeiouéèêëàâîïôûù]"]

[[checks]]
check_id = "answer-label"
message = "Yes/no answers start with Oui or Non."
must_contain = ["^(oui|non)[,.]"]
uses = ["answer", "option"]
