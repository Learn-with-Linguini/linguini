construction_id = "my-preference"
version = 1
summary = "Say that I like (or do not like) the object."
guidance = "Say J'aime + definite article + noun, or Je n'aime pas … when the use is dislike: J'aime la tasse. Je n'aime pas le livre. Elide before a vowel: J'aime l'assiette."
features = ["preference", "first-person"]
constraints = ["Express only the selected scene facts and preserve role bindings.", "Treat these rules as generation guidance, not a grammar validator."]
required_labels = []
roles = { object = "noun" }
provenance = { source = "AI-authored original Linguini M05 draft, 2026-10-23; not human-reviewed.", review_status = "generated" }

[[checks]]
check_id = "preference-frame"
message = "Say the first-person like frame."
must_contain = ["^(j'aime|je n'aime pas) ", "\\.$"]

[[checks]]
check_id = "dislike-negated"
message = "A dislike sentence says the negative."
must_contain = ["n'aime pas"]
uses = ["dislike"]

[[checks]]
check_id = "like-not-negated"
message = "A like sentence is not negated."
must_not_contain = ["\\bpas\\b"]
uses = ["like"]
