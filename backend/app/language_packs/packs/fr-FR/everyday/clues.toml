text = "Elle est"

[[prefixes]]
frame = "location"
agreement = "masculine"
text = "Il est"

[[prefixes]]
frame = "location"
text = "C'est"

[[articles]]
agreement = "masculine"
text = "le"

[[articles]]
agreement = "feminine"
text = "la"

[[contractions]]
preposition = "de"
article = "le"
text = "du"

[[contractions]]
preposition = "de"
article = "les"
text = "des"

[[contractions]]
preposition = "à"
article = "le"
text = "au"

[[contractions]]
preposition = "à"
article = "les"
text = "aux"

# A clue also avoids the target with x after au or eu (gâteau → gâteaux).
[[avoid_plurals]]
after = ["au", "eu"]
suffix = "x"

[[positions]]
text = "sur"
meaning = "on"
example = "Le livre est sur la table."

[[positions]]
text = "sous"
meaning = "under"
example = "Le chat est sous la chaise."

[[positions]]
text = "à côté de"
meaning = "next to"
example = "La chaise est à côté de la porte."

[[positions]]
text = "devant"
meaning = "in front of"
example = "Le chien est devant la maison."

[[positions]]
text = "derrière"
meaning = "behind"
example = "L'arbre est derrière la maison."

# Singular (masculine, feminine) forms. A colour missing here is never suggested,
# because its agreement with the target noun cannot be established safely.
