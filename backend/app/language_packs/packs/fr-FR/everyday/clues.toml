# The closed grammar guided I-Spy clue frames and photo-room clues are built from.
provenance = { source = "Moved unchanged from dev's hand-written I-Spy clue and photo-room tables (app/services/ispy_clue_frames.py, room_clues.py), 2026-10-25; not human-reviewed.", review_status = "unreviewed" }
place = "{position} {reference}"
conjunction = "et"
elided_articles = ["l'"]
location_verb_starts = ["est", "il est", "elle est"]

[examples]
colour = "La pomme est rouge."
location = "Le livre est sur la table."

[[prefixes]]
frame = "colour"
agreement = "feminine"
text = "Elle est"

[[prefixes]]
frame = "colour"
agreement = "masculine"
text = "Il est"

[[prefixes]]
frame = "colour"
text = "C'est"

[[prefixes]]
