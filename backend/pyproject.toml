[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend contracts for Linguini"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "Pillow>=12.1,<13",
  "google-genai>=1,<2",
  "openai>=2,<3",
  "langfuse>=4.15,<5",
  "pyjwt[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
grounding = [
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
