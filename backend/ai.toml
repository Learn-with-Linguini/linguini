# AI configuration: credentials, deployments and feature routes. The backend
# loads this file unless AI_CONFIG_FILE names another one. It holds no
# secrets: credentials name the environment variables that do. Model choices
# are justified in MODEL_COMPARISON.md.
#
# Credentials: the first non-empty variable in `env` wins.
# Deployments: adapter (openai | openrouter | gemini), api (responses for
#   openai/openrouter, generateContent for gemini), model, capabilities
#   (text | vision | jsonSchema), eligible credential IDs, generation defaults.
#   OpenRouter deployments must set upstream_fallback: allow_fallbacks lets
#   OpenRouter try other hosts for the same model and `models` lists fallback
#   models. Those attempts happen inside one request, so max_model_calls
#   counts them as one call.
# Routes: one per feature. `policy = "priority"` tries deployments in listed
#   order, failing over on transient errors; `"primary"` uses only the first.
#   Every call for one feature operation, including failover and output
#   repair, shares deadline_seconds and max_model_calls.

[credentials.openrouter]
adapter = "openrouter"
env = ["AI_OPENROUTER_API_KEY"]
quota_group = "openrouter"
billing_group = "openrouter"

# Three OpenAI keys share the load: every OpenAI deployment takes them in turn,
# skipping a key that is missing, invalid or cooling down. OpenAI limits and
# bills per organisation, so each key has its own quota_group on the assumption
# that each comes from a different organisation. Keys from one organisation must
# share a quota_group, since a rate limit on one then applies to all of them.
# Key 1 falls back to AI_OPENAI_API_KEY so a single-key .env.local still works.
[credentials.openai-1]
adapter = "openai"
env = ["AI_OPENAI_API_KEY_1", "AI_OPENAI_API_KEY"]
quota_group = "openai-1"
billing_group = "openai-1"

[credentials.openai-2]
adapter = "openai"
env = ["AI_OPENAI_API_KEY_2"]
quota_group = "openai-2"
billing_group = "openai-2"

[credentials.openai-3]
adapter = "openai"
env = ["AI_OPENAI_API_KEY_3"]
quota_group = "openai-3"
billing_group = "openai-3"

[credentials.gemini-1]
adapter = "gemini"
env = ["AI_GEMINI_API_KEY_1", "AI_GEMINI_API_KEY"]
quota_group = "gemini-1"
billing_group = "gemini-1"

[credentials.gemini-2]
adapter = "gemini"
env = ["AI_GEMINI_API_KEY_2"]
quota_group = "gemini-2"
billing_group = "gemini-2"

[credentials.gemini-3]
adapter = "gemini"
env = ["AI_GEMINI_API_KEY_3"]
quota_group = "gemini-3"
billing_group = "gemini-3"

[deployments.scene-gpt-4-1-mini]
adapter = "openai"
api = "responses"
model = "gpt-4.1-mini"
capabilities = ["vision", "jsonSchema"]
credentials = ["openai-1", "openai-2", "openai-3"]
defaults = { timeout_seconds = 120, max_output_tokens = 5000, max_retries = 0 }

[deployments.translation-gpt-4o-mini]
adapter = "openai"
api = "responses"
model = "gpt-5.4-mini"
capabilities = ["text", "jsonSchema"]
credentials = ["openai-1", "openai-2", "openai-3"]
# Larger scenes can exceed the shared 1,500-token default when every object,
# attribute and relationship is returned as structured translation JSON.
defaults = { timeout_seconds = 60, max_output_tokens = 4000, max_retries = 1 }

[deployments.lessons-gpt-5-4-mini]
adapter = "openai"
api = "responses"
model = "gpt-5.4-mini"
capabilities = ["text", "jsonSchema"]
credentials = ["openai-1", "openai-2", "openai-3"]
defaults = { timeout_seconds = 60, max_output_tokens = 4000, max_retries = 1 }

[deployments.clues-gemini-flash-lite]
adapter = "gemini"
api = "generateContent"
model = "gemini-3.1-flash-lite"
capabilities = ["text", "jsonSchema"]
credentials = ["gemini-1", "gemini-2", "gemini-3"]
defaults = { timeout_seconds = 60, max_retries = 1 }

[deployments.guess-gpt-4-1-mini]
adapter = "openai"
api = "responses"
model = "gpt-4.1-mini"
capabilities = ["text", "jsonSchema"]
credentials = ["openai-1", "openai-2", "openai-3"]
defaults = { timeout_seconds = 60, max_retries = 0 }

[routes.sceneAnalysis]
deployments = ["scene-gpt-4-1-mini"]
policy = "priority"
deadline_seconds = 120
max_model_calls = 1

[routes.sceneTranslation]
deployments = ["translation-gpt-4o-mini"]
policy = "priority"
deadline_seconds = 120
max_model_calls = 2

[routes.learningTask]
deployments = ["lessons-gpt-5-4-mini"]
policy = "priority"
deadline_seconds = 120
max_model_calls = 2

[routes.ispyClue]
deployments = ["clues-gemini-flash-lite"]
policy = "priority"
deadline_seconds = 120
max_model_calls = 3

[routes.ispyGuess]
deployments = ["guess-gpt-4-1-mini"]
policy = "priority"
deadline_seconds = 60
max_model_calls = 1
